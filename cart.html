<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | TechStore</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header>

        <div class="logo">
            <h2>💻 TechStore</h2>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
           
        </nav>

    </header>

    <!-- Cart Section -->
    <section>

        <h2>Shopping Cart</h2>

      <table style="width:100%; border-collapse: collapse; background:#fff; box-shadow:0 5px 15px rgba(0,0,0,.1);">

    <thead>
        <tr style="background:#0d47a1; color:white;">
            <th style="padding:15px;">Laptop</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="cart-items">

    </tbody>

</table>

<div style="margin-top:30px; text-align:right;">

    <h2 id="cart-total">Total: ₹0</h2>

    <br>

    <a href="checkout.html" class="btn">
        Proceed to Checkout
    </a>

</div>
</section> 

    <!-- Footer -->

    <footer>

        <p>© 2026 TechStore. All Rights Reserved.</p>

    </footer>

    <script src="js/cart.js"></script>

</body>
</html>
